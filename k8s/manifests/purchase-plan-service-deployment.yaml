apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchase-plan-service
  ## namespace: medisupply
  labels:
    app: purchase-plan-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: purchase-plan-service
      version: v1
  template:
    metadata:
      labels:
        app: purchase-plan-service
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "false"
        # Configuración de telemetría para Envoy
        proxy.istio.io/config: |
          proxyStatsMatcher:
            inclusionRegexps:
            - ".*outlier_detection.*"
            - ".*circuit_breakers.*"
            - ".*upstream_rq_retry.*"
            - ".*upstream_rq_pending.*"
            - ".*_cx_.*"
    spec:
      containers:
      - name: purchase-plan-service
        image: jssierrac1/arqnewgen-medisupply-purchase-plan-service:beta
        imagePullPolicy: Always  # Pull from registry
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        env:
        # Basic service configuration
        - name: SERVICE_NAME
          value: "purchase-plan-service"
        - name: SERVICE_VERSION
          value: "v1"
        - name: SERVICE_NAMESPACE
          value: "medi"
        - name: ENVIRONMENT
          value: "poc"
        envFrom:
        - configMapRef:
            name: purchase-plan-service-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: data-volume
        emptyDir: {}
