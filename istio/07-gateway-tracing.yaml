apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: gateway-tracing
  namespace: istio-system
spec:
  # Configuración específica para el Ingress Gateway
  selector:
    matchLabels:
      app: istio-proxy
      istio: ingressgateway
  tracing:
    - randomSamplingPercentage: 100.0
      providers:
        - name: jaeger
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: gateway-health-filter
  namespace: istio-system
spec:
  # Aplicar solo al Ingress Gateway
  workloadSelector:
    labels:
      app: istio-proxy
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.router"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              function envoy_on_request(request_handle)
                local path = request_handle:headers():get(":path")
                
                -- Filtrar health checks en el gateway
                if path then
                  if string.match(path, "/health") or
                     string.match(path, "/ping") or
                     string.match(path, "/ready") or
                     string.match(path, "/live") or
                     string.match(path, "/metrics") then
                    -- Deshabilitar tracing para este request
                    request_handle:headers():add("x-b3-sampled", "0")
                  end
                end
              end
